# Generates include/vikshep_backend.h:
#   cbindgen --config crates/vikshep-capi/cbindgen.toml --crate vikshep-capi \
#            --output include/vikshep_backend.h
language = "C"
header = """/*
 * vikshep_backend.h - C ABI of the five VDS-1 Tier-1 kernels.
 * Generated by cbindgen from crates/vikshep-capi/src/lib.rs; do not edit.
 * SPDX-License-Identifier: AGPL-3.0-or-later
 * Copyright (C) 2026 Samvardhan Singh
 *
 * Memory ownership: the caller owns every buffer; kernels must not retain
 * pointers after returning. VkspComplex32 is { float re; float im; },
 * 8 bytes, alignment 4. Calls are synchronous. See the crate documentation
 * of vikshep-capi and spec/VDS-1.md section 14.6.
 */"""
include_guard = "VIKSHEP_BACKEND_H"
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "both"
usize_is_size_t = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true

[export]
include = ["VkspBackendV1", "VkspComplex32", "VkspCanvas", "VkspSubsample", "VkspCapabilities"]
