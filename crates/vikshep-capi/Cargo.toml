[package]
name = "vikshep-capi"
description = "C ABI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
vikshep-backend-api.workspace = true
vikshep-cpu.workspace = true

[dev-dependencies]
vikshep-numerics.workspace = true

# This crate does not inherit the workspace lint table: it will contain a
# foreign-function interface, which cannot be written without `unsafe`, so
# `unsafe_code = "forbid"` (workspace default) cannot apply. Instead every
# unsafe operation must sit in an explicit, documented `unsafe` block.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
