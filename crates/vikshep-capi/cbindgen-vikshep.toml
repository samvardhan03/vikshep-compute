# Generates include/vikshep.h (stable host API):
#   cbindgen --config crates/vikshep-capi/cbindgen-vikshep.toml --crate vikshep-capi \
#            --output include/vikshep.h
language = "C"
header = """/*
 * vikshep.h - stable C API of Vikshep compute: scattering, r2, fingerprint,
 * provenance manifest, conformance self-test, version information.
 * Generated by cbindgen from crates/vikshep-capi/src/api.rs; do not edit.
 * SPDX-License-Identifier: AGPL-3.0-or-later
 * Copyright (C) 2026 Samvardhan Singh
 *
 * Conventions (see the crate documentation of vikshep-capi):
 * - every function returns a status code (VKSP_OK on success, codes in
 *   vikshep_backend.h); vksp_last_error() describes the last failure on the
 *   calling thread; no Rust panic crosses this boundary;
 * - array outputs use caller-allocated buffers: out_len always receives the
 *   required element count; out == NULL is a size query (returns VKSP_OK);
 *   a short buffer returns VKSP_BUFFER_TOO_SMALL; an empty output is always
 *   computed (its OID is written);
 * - text outputs follow the same protocol in bytes, len excludes the NUL;
 * - OIDs are 28 lowercase hex characters plus a NUL (29 bytes);
 * - backend == NULL selects the CPU reference ("cpu"); other names refer to
 *   backends registered with vksp_register_backend().
 */"""
include_guard = "VIKSHEP_H"
includes = ["vikshep_backend.h"]
cpp_compat = true
documentation = true
documentation_style = "c99"
style = "both"
usize_is_size_t = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true

[export]
include = ["VkspScatterConfig", "VkspVersionInfo"]
exclude = [
    "VkspBackendV1", "VkspComplex32", "VkspCanvas", "VkspSubsample", "VkspCapabilities",
    "vksp_cpu_backend_v1", "vksp_register_backend", "vksp_unregister_backend",
    "VKSP_ABI_VERSION", "VKSP_OK", "VKSP_INVALID_ARGUMENT", "VKSP_DEVICE_ERROR",
    "VKSP_BUFFER_TOO_SMALL", "VKSP_UNKNOWN_BACKEND", "VKSP_ALREADY_REGISTERED",
    "VKSP_CONFORMANCE_FAILED", "VKSP_INTERNAL_ERROR", "BUILTIN_BACKEND",
]
